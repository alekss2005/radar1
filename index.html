<!DOCTYPE html>
<html lang="uk" data-theme="military">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=5.0, user-scalable=yes, viewport-fit=cover" />
<meta name="mobile-web-app-capable" content="yes" />
<meta name="apple-mobile-web-app-capable" content="yes" />
<title>KYIV OSINT RADAR v15.4</title>
<link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" integrity="sha256-p4NxAoJBhIIN+hmNHrzRCf9tD/miZyoHS5obTRR9BMY=" crossorigin="" />
<style>
:root,[data-theme="military"]{--bg:#050a10;--panel:rgba(8,16,24,.92);--panel-solid:#0b1520;--text:#e8f0f5;--muted:#7a8f9e;--accent:#22d3ee;--accent-soft:rgba(34,211,238,.15);--danger:#ef4444;--ok:#34d399;--warn:#fbbf24;--border:rgba(34,211,238,.18);--header-bg:rgba(5,10,16,.94);--btn-bg:rgba(12,22,32,.9);--btn-border:rgba(148,163,184,.22);--event-border:#132028;--glow:0 0 12px rgba(34,211,238,.35);--radius:12px;--font:"SF Mono",ui-monospace,Menlo,Consolas,monospace;--font-ui:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif;--safe-top:env(safe-area-inset-top,0px);--safe-bottom:env(safe-area-inset-bottom,0px)}
*{box-sizing:border-box;margin:0;padding:0}
html,body{height:100%;width:100%;overflow:hidden;font-family:var(--font-ui);background:var(--bg);color:var(--text);-webkit-tap-highlight-color:transparent}
#app{position:absolute;inset:0;display:flex;flex-direction:column}
.header{min-height:42px;background:var(--header-bg);border-bottom:1px solid var(--border);display:flex;align-items:center;justify-content:space-between;padding:6px 12px;padding-top:calc(6px + var(--safe-top));z-index:1000;backdrop-filter:blur(16px);flex:0 0 auto;font-size:12px;gap:8px}
.logo{font-weight:800;letter-spacing:.06em;font-size:11px;display:flex;align-items:center;gap:7px;white-space:nowrap;font-family:var(--font)}
.logo-icon{font-size:14px;filter:drop-shadow(0 0 6px var(--accent))}
.header-right{display:flex;align-items:center;gap:8px;flex:1;justify-content:flex-end;min-width:0}
.search-box{display:flex;align-items:center;background:var(--panel);border:1px solid var(--border);border-radius:999px;overflow:hidden;height:32px;flex:1;max-width:260px;min-width:100px}
.search-box input{background:transparent;border:0;color:var(--text);padding:0 12px;font-size:12px;width:100%;outline:none}
.search-box input::placeholder{color:var(--muted)}
.search-box button{background:transparent;border:0;color:var(--accent);width:34px;height:32px;cursor:pointer;font-size:13px;display:flex;align-items:center;justify-content:center;flex-shrink:0}
.lang-btn-header{background:var(--btn-bg);border:1px solid var(--border);color:var(--accent);border-radius:999px;font-size:11px;cursor:pointer;font-weight:800;width:34px;height:32px;display:inline-flex;align-items:center;justify-content:center;flex:0 0 auto;font-family:var(--font)}
.lang-btn-header.en{color:var(--ok)}
.status{display:flex;align-items:center;gap:6px;font-size:10px;color:var(--muted);font-weight:700;white-space:nowrap;font-family:var(--font)}
.status-dot{width:7px;height:7px;border-radius:50%;background:var(--ok);box-shadow:0 0 10px var(--ok)}
.status-dot.err{background:var(--danger);box-shadow:0 0 10px var(--danger)}
.status-dot.warn{background:var(--warn);box-shadow:0 0 10px var(--warn)}
.ballistic-timer{display:none;padding:0 10px;height:32px;border-radius:999px;align-items:center;justify-content:center;font-family:var(--font);font-weight:900;font-size:12px;color:#fff;background:#7c2d12;border:2px solid #fca5a5;box-shadow:0 0 12px rgba(220,38,38,.7);flex:0 0 auto;min-width:66px;white-space:nowrap;animation:btPulse 1s ease-in-out infinite}
.ballistic-timer.show{display:inline-flex}
@keyframes btPulse{0%,100%{box-shadow:0 0 12px rgba(220,38,38,.7);transform:scale(1)}50%{box-shadow:0 0 24px rgba(220,38,38,1);transform:scale(1.04)}}
.search-results{position:absolute;top:calc(48px + var(--safe-top));right:10px;left:10px;z-index:5000;background:var(--panel);border:1px solid var(--border);border-radius:var(--radius);max-width:400px;margin-left:auto;max-height:260px;overflow-y:auto;width:280px;display:none;box-shadow:0 8px 24px rgba(0,0,0,.55);backdrop-filter:blur(12px)}
.search-results.show{display:block}
.search-item{padding:9px 12px;cursor:pointer;font-size:12px;border-bottom:1px solid rgba(148,163,184,.12)}
.search-item:last-child{border-bottom:0}
.search-item:hover{background:rgba(59,130,246,.18)}
.search-item .name{font-weight:700;color:var(--text)}
.search-item .addr{font-size:10px;color:var(--muted);margin-top:2px}
#map{flex:1;min-height:0;width:100%;background:var(--bg)}
[data-theme="military"] #map{background:#dbe4ee}
.top-alert{position:absolute;top:calc(48px + var(--safe-top) + 8px);left:6px;right:6px;z-index:4600;border-radius:10px;overflow:hidden;display:none;box-shadow:0 6px 24px rgba(0,0,0,.5);backdrop-filter:blur(10px)}
.top-alert.show{display:block;animation:alertIn .3s ease-out}
@keyframes alertIn{from{transform:translateY(-8px);opacity:0}to{transform:translateY(0);opacity:1}}
.top-alert.ballistic{background:linear-gradient(90deg,#7f1d1d,#dc2626,#7f1d1d);color:#fff;animation:bbPulse .6s ease-in-out infinite;border:1px solid #fca5a5}
@keyframes bbPulse{0%,100%{background:linear-gradient(90deg,#7f1d1d,#dc2626,#7f1d1d)}50%{background:linear-gradient(90deg,#dc2626,#fca5a5,#dc2626)}}
.top-alert.impact{background:linear-gradient(90deg,#7c2d12,#ea580c,#7c2d12);color:#fff;border:1px solid #fdba74}
.top-alert.falling{background:linear-gradient(90deg,#78350f,#f59e0b,#78350f);color:#fff;border:1px solid #fcd34d}
.top-alert.shot{background:linear-gradient(90deg,#14532d,#16a34a,#14532d);color:#fff;border:1px solid #86efac}
.top-alert.fire{background:linear-gradient(90deg,#7c2d12,#f97316,#7c2d12);color:#fff;border:1px solid #fdba74}
.top-alert-inner{padding:9px 34px 9px 12px;display:flex;align-items:center;gap:10px;font-weight:800;font-size:.86rem;line-height:1.25}
.top-alert-icon{font-size:1.4rem;flex-shrink:0}
.top-alert-body{flex:1;min-width:0}
.top-alert-title{font-weight:800;font-size:.86rem}
.top-alert-place,.top-alert-meta{font-size:.78rem;font-weight:700;margin-top:2px;opacity:.95}
.top-alert-close{position:absolute;top:6px;right:6px;background:rgba(0,0,0,.25);border:0;color:#fff;width:22px;height:22px;border-radius:50%;font-size:1rem;cursor:pointer;display:flex;align-items:center;justify-content:center;padding:0}
.mass-banner{position:absolute;top:calc(36px + var(--safe-top) + 6px);left:6px;right:6px;z-index:4620;border-radius:10px;overflow:hidden;display:none;box-shadow:0 6px 24px rgba(0,0,0,.6);background:linear-gradient(135deg,#4c1d95,#7c3aed,#4c1d95);border:1px solid #c4b5fd;color:#fff}
.mass-banner.show{display:block;animation:alertIn .3s ease-out}
.mass-banner-inner{padding:10px 34px 10px 12px;display:flex;align-items:flex-start;gap:10px;font-weight:700;font-size:.8rem;line-height:1.35}
.mass-banner-icon{font-size:1.5rem}
.mass-banner-body{flex:1;min-width:0}
.mass-banner-title{font-weight:800;font-size:.86rem}
.mass-banner-line{font-size:.74rem;font-weight:700;margin-top:3px;opacity:.95}
.mass-banner-line b{color:#fde047}
.mass-banner-close{position:absolute;top:6px;right:6px;background:rgba(0,0,0,.3);border:0;color:#fff;width:22px;height:22px;border-radius:50%;font-size:1rem;cursor:pointer;display:flex;align-items:center;justify-content:center;padding:0}
.strategic-panel{position:absolute;top:calc(36px + var(--safe-top) + 6px);left:6px;right:6px;z-index:4550;background:rgba(15,23,42,.95);border:1px solid rgba(250,204,21,.5);border-radius:10px;padding:8px 12px;display:none;box-shadow:0 6px 24px rgba(0,0,0,.5);font-size:.72rem;max-height:30vh;overflow-y:auto}
.strategic-panel.show{display:block}
.strategic-panel-title{font-weight:800;color:#facc15;margin-bottom:6px;font-size:.78rem;display:flex;justify-content:space-between;align-items:center}
.strategic-panel-close{background:0;border:0;color:#facc15;font-size:1.1rem;cursor:pointer;padding:0 4px}
.strategic-panel-item{color:#e2e8f0;padding:3px 0;border-bottom:1px solid rgba(148,163,184,.15);display:flex;gap:6px}
.strategic-panel-summary{color:#fca5a5;font-weight:800;margin-top:6px;padding-top:6px;border-top:1px solid rgba(220,38,38,.4);font-size:.7rem}
.panel{position:absolute;left:6px;right:6px;bottom:calc(54px + var(--safe-bottom));background:var(--panel);border:1px solid var(--border);border-radius:var(--radius);overflow:hidden;z-index:900;backdrop-filter:blur(18px);display:flex;flex-direction:column;max-height:20vh;transition:max-height .22s ease;box-shadow:0 8px 32px rgba(0,0,0,.35)}
.panel.collapsed{max-height:40px}
.panel-header{padding:10px 14px;display:flex;justify-content:space-between;align-items:center;cursor:pointer;user-select:none;height:40px;flex:0 0 40px}
.panel-title{font-size:12px;font-weight:800;letter-spacing:.06em;display:flex;align-items:center;gap:6px;font-family:var(--font);text-transform:uppercase}
.panel-count{font-size:11px;color:var(--muted);font-weight:700;display:flex;align-items:center;gap:5px}
.panel-chev{font-size:.7rem;color:var(--muted);transition:transform .2s}
.panel.collapsed .panel-chev{transform:rotate(-90deg)}
.events{overflow-y:auto;flex:1;min-height:0;padding:4px 8px 8px}
.event{padding:10px 12px;margin-bottom:6px;border-radius:10px;border:1px solid var(--event-border);border-left:3px solid var(--accent);cursor:pointer;background:rgba(0,0,0,.2)}
.event:hover{background:var(--accent-soft)}
.event-top{display:flex;justify-content:space-between;gap:8px;align-items:center}
.event-type{font-weight:800;font-size:12px;display:flex;align-items:center;gap:6px;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.event-icon{font-size:13px;flex-shrink:0}
.event-prio{color:var(--warn);font-size:11px}
.event-time{font-size:10px;color:var(--muted);flex-shrink:0;font-weight:700;font-family:var(--font)}
.event-loc{margin-top:3px;font-size:11px;color:var(--muted);overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.event-meta{margin-top:3px;display:flex;gap:3px;flex-wrap:wrap}
.tag{padding:1px 5px;border-radius:4px;background:#132630;color:#8faab8;font-size:8px;font-weight:700}
.tag.prio{background:rgba(251,191,36,.25);color:#fbbf24}
.tag.stage-launch{background:rgba(220,38,38,.3);color:#fecaca}
.tag.stage-impact{background:rgba(220,38,38,.4);color:#fecaca}
.tag.speed{background:rgba(59,130,246,.3);color:#93c5fd}
.tag.strategic{background:rgba(250,204,21,.3);color:#fde047}
.tag.mass{background:rgba(124,58,237,.4);color:#ddd6fe}
.tag.seed{background:rgba(168,85,247,.35);color:#e9d5ff}
.panel-empty{padding:14px 10px;text-align:center;color:var(--muted);font-size:10px}
.hud-bottom{position:absolute;bottom:calc(14px + var(--safe-bottom));left:0;right:0;z-index:1000;padding:0 6px;pointer-events:none}
.hud-bottom>*{pointer-events:auto}
.btn-row{display:flex;gap:4px;overflow-x:auto;padding:4px 6px;background:var(--panel);border:1px solid var(--border);border-radius:999px;backdrop-filter:blur(18px);box-shadow:0 6px 20px rgba(0,0,0,.4);-webkit-overflow-scrolling:touch;scrollbar-width:none;width:100%}
.btn-row::-webkit-scrollbar{display:none}
.btn-row button{border-radius:999px;min-width:36px;height:36px;flex:1;border-color:transparent;background:transparent}
button{background:var(--btn-bg);border:1px solid var(--btn-border);color:var(--text);border-radius:var(--radius);font-size:.95rem;cursor:pointer;font-weight:700;min-width:38px;height:38px;display:inline-flex;align-items:center;justify-content:center;flex:0 0 auto;touch-action:manipulation;padding:0}
button:active{background:var(--accent-soft)}
button.danger{color:#fca5a5}
button.on{border-color:var(--accent);box-shadow:var(--glow);background:var(--accent-soft)}
button.siren-btn{color:var(--danger)}
button.siren-btn.active{background:var(--danger)!important;color:#fff!important;animation:sirenFlash .35s ease-in-out infinite}
@keyframes sirenFlash{0%,100%{box-shadow:0 0 0 0 rgba(220,38,38,.8)}50%{box-shadow:0 0 0 6px rgba(220,38,38,0)}}
button.sound-btn.muted{color:var(--danger);border-color:transparent;background:var(--btn-bg)}
button.sound-btn.on{color:var(--ok)}
button.fs-btn.on{background:rgba(99,102,241,.9);color:#fff}
button.hist-btn.on{background:rgba(16,185,129,.85);color:#fff}
button.geo-btn.on{background:rgba(34,211,238,.9);color:#04202a;border-color:#22d3ee;box-shadow:0 0 14px rgba(34,211,238,.7)}
.dev-signature{position:absolute;bottom:0;left:0;right:0;text-align:center;font-size:9px;font-weight:700;letter-spacing:.1em;pointer-events:none;z-index:1100;font-family:var(--font);padding:1px 0 calc(1px + var(--safe-bottom));color:#3b82f6;opacity:.9}
.leaflet-popup-content-wrapper{background:var(--panel-solid);color:var(--text);border-radius:var(--radius);border:1px solid var(--border);box-shadow:0 8px 28px rgba(0,0,0,.55)}
.leaflet-popup-tip{background:rgba(7,16,24,.97)}
.leaflet-popup-content{margin:9px 11px;font-size:.75rem;line-height:1.4;max-width:250px}
.leaflet-popup-close-button{color:#94a3b8!important;font-size:18px!important;padding:2px 6px!important}
.popup-title{font-weight:700;font-size:.82rem;margin-bottom:4px;display:flex;align-items:center;gap:5px}
.popup-meta{color:#94a3b8;font-size:.68rem}
.popup-guess{color:#fbbf24;font-size:.66rem;margin-top:4px}
.popup-channels{margin-top:6px;padding-top:5px;border-top:1px solid rgba(148,163,184,.18);font-size:.66rem}
.popup-channels .ch{display:inline-block;background:rgba(148,163,184,.2);color:#cbd5e1;padding:1px 6px;border-radius:8px;margin:2px 2px 2px 0;border:1px solid rgba(148,163,184,.3)}
.popup-channels .ch.prio{background:rgba(251,191,36,.25);border-color:rgba(251,191,36,.5);color:#fbbf24}
.popup-channels .ch.seed{background:rgba(168,85,247,.25);border-color:rgba(168,85,247,.5);color:#e9d5ff}
.popup-remove-btn{margin-top:8px;width:100%;height:30px;font-size:.75rem;background:rgba(220,38,38,.25);border:1px solid rgba(248,113,113,.5);color:#fca5a5;border-radius:6px;cursor:pointer;font-weight:800}
.popup-toggle-btn{margin-top:6px;width:100%;height:30px;font-size:.75rem;background:rgba(34,211,238,.2);border:1px solid rgba(34,211,238,.5);color:#67e8f9;border-radius:6px;cursor:pointer;font-weight:800}
.popup-speed{background:rgba(234,88,12,.3);color:#fdba74;padding:3px 6px;border-radius:5px;font-weight:700;font-size:.72rem;display:inline-block;margin-top:4px;border:1px solid rgba(253,186,116,.5)}
.popup-eta{background:rgba(220,38,38,.25);color:#fca5a5;padding:3px 6px;border-radius:5px;font-weight:700;font-size:.68rem;display:inline-block;margin-top:4px;border:1px solid rgba(248,113,113,.4)}
.popup-dist{background:rgba(59,130,246,.25);color:#93c5fd;padding:3px 6px;border-radius:5px;font-weight:700;font-size:.68rem;display:inline-block;margin-top:4px;border:1px solid rgba(147,197,253,.4)}
.popup-alt{background:rgba(22,163,74,.25);color:#86efac;padding:3px 6px;border-radius:5px;font-weight:700;font-size:.68rem;display:inline-block;margin-top:4px}
.popup-exactname{background:rgba(220,38,38,.3);color:#fecaca;padding:3px 6px;border-radius:5px;font-weight:800;font-size:.72rem;display:inline-block;margin-top:4px;border:1px solid rgba(248,113,113,.5)}
.popup-trail{margin-top:6px;padding:6px 8px;border-radius:5px;background:rgba(148,163,184,.12);border:1px dashed rgba(148,163,184,.5);font-size:.68rem;line-height:1.45;color:#cbd5e1;max-height:150px;overflow-y:auto}
.popup-trail .pt-title{font-weight:700;color:#e2e8f0;margin-bottom:3px}
.popup-trail .pt-point{display:flex;gap:5px;align-items:flex-start;margin:1px 0}
.popup-trail .pt-num{flex-shrink:0;color:#94a3b8;min-width:14px}
.popup-trail .pt-place{flex:1;color:#e2e8f0}
.popup-trail .pt-time{color:#94a3b8;font-size:.6rem;margin-left:3px}
.popup-trail .pt-arrow{color:#fbbf24;font-weight:800}
.popup-user-rel{background:rgba(34,211,238,.22);color:#67e8f9;padding:3px 6px;border-radius:5px;font-weight:800;font-size:.7rem;display:inline-block;margin-top:4px;border:1px solid rgba(34,211,238,.55)}
.popup-user-rel .rel-arrow{color:#22d3ee;font-weight:900;margin-right:2px}
.popup-user-rel .rel-close{color:#fbbf24;font-weight:900;margin-left:3px}
.threat-wrap{position:relative;width:28px;height:28px}
.threat-rotate{position:absolute;inset:0;transform-origin:center center;will-change:transform}
.threat-icon{width:28px;height:28px;display:flex;align-items:center;justify-content:center;filter:drop-shadow(0 0 5px rgba(0,0,0,.5));transform-origin:center center;position:relative;animation:pulse 1.8s ease-in-out infinite}
.threat-icon svg{width:24px;height:24px;display:block}
@keyframes pulse{0%,100%{filter:drop-shadow(0 0 3px rgba(0,0,0,.5));opacity:1}50%{filter:drop-shadow(0 0 8px rgba(251,191,36,.55));opacity:.92}}
.threat-icon.confirm-2{filter:drop-shadow(0 0 7px rgba(34,197,94,.9))}
.threat-icon.confirm-3{filter:drop-shadow(0 0 10px rgba(250,204,21,.95));animation:cPulse 1.3s ease-in-out infinite}
.threat-icon.confirm-5{filter:drop-shadow(0 0 14px rgba(250,204,21,1));animation:cPulse 1s ease-in-out infinite}
@keyframes cPulse{0%,100%{transform:scale(1)}50%{transform:scale(1.1)}}
.threat-icon.falling{animation:fallingBlink .55s ease-in-out infinite}
@keyframes fallingBlink{0%,100%{filter:drop-shadow(0 0 2px rgba(220,38,38,.9));opacity:1}50%{filter:drop-shadow(0 0 12px rgba(220,38,38,1));opacity:.35}}
.threat-icon.falling svg path,.threat-icon.falling svg polygon,.threat-icon.falling svg rect{fill:#dc2626!important;stroke:#7f1d1d!important}
.threat-icon.stale{opacity:.55;filter:grayscale(.4)}
.threat-icon.threat-pulse{animation:threatPulse 1s ease-in-out infinite}
@keyframes threatPulse{0%,100%{filter:drop-shadow(0 0 3px rgba(220,38,38,.9));opacity:1}50%{filter:drop-shadow(0 0 12px rgba(220,38,38,1));opacity:.55}}
.threat-icon.uav-siren{animation:uavSirenPulse .7s ease-in-out infinite}
@keyframes uavSirenPulse{0%,100%{transform:scale(1);filter:drop-shadow(0 0 5px rgba(251,191,36,.95))}50%{transform:scale(1.18);filter:drop-shadow(0 0 16px rgba(251,191,36,1))}}
.threat-icon.ballistic-alarm{animation:ballisticAlarmPulse .5s ease-in-out infinite}
@keyframes ballisticAlarmPulse{0%,100%{transform:scale(1);filter:drop-shadow(0 0 6px rgba(220,38,38,1))}50%{transform:scale(1.2);filter:drop-shadow(0 0 16px rgba(220,38,38,1));opacity:.75}}
.threat-icon.priority-star::after{content:"⭐";position:absolute;top:-10px;left:-6px;font-size:11px}
.threat-icon.arrived-pulse{animation:arrivedPulse .7s ease-in-out infinite}
@keyframes arrivedPulse{0%,100%{transform:scale(1);filter:drop-shadow(0 0 6px rgba(220,38,38,1));opacity:1}50%{transform:scale(1.25);filter:drop-shadow(0 0 18px rgba(220,38,38,1));opacity:.55}}
.threat-icon.arrived-pulse svg path,.threat-icon.arrived-pulse svg polygon,.threat-icon.arrived-pulse svg rect,.threat-icon.arrived-pulse svg ellipse{fill:#dc2626!important;stroke:#7f1d1d!important}
.threat-icon.near-user-far::before{content:"";position:absolute;inset:-5px;border:2px solid #facc15;border-radius:50%;box-shadow:0 0 10px rgba(250,204,21,.9);animation:nearUserFarPulse 1.8s ease-in-out infinite;pointer-events:none}
@keyframes nearUserFarPulse{0%,100%{transform:scale(1);opacity:1}50%{transform:scale(1.12);opacity:.6}}
.threat-icon.near-user-near::before{content:"";position:absolute;inset:-5px;border:2px solid #dc2626;border-radius:50%;box-shadow:0 0 12px rgba(220,38,38,.95);animation:nearUserNearPulse 1.1s ease-in-out infinite;pointer-events:none}
@keyframes nearUserNearPulse{0%,100%{transform:scale(1);opacity:1}50%{transform:scale(1.18);opacity:.5}}
.strat-wrap{position:relative}
.strat-icon{width:32px;height:32px;display:flex;align-items:center;justify-content:center;filter:drop-shadow(0 0 6px rgba(0,0,0,.6))}
.strat-icon svg{width:28px;height:28px;display:block}
.strat-icon.training{animation:stratTrain 2.5s ease-in-out infinite}
.strat-icon.active{animation:stratActive 1.2s ease-in-out infinite}

const RadarLog = (() => {
  const buf = []; const MAX = 200;
  function push(scope, msg, err) {

    try { const b = $("errBanner"), tt = $("errText"); if (b && tt) { tt.textContent = String(m || "?"); b.classList.add("show"); } } catch (e) {}

})();

function haversineKm(a, b, c, d) {
  const R = 6371, toR = x => x * Math.PI / 180;
  const dLat = toR(c - a), dLon = toR(d - b);
  const x = Math.sin(dLat / 2) ** 2 + Math.cos(toR(a)) * Math.cos(toR(c)) * Math.sin(dLon / 2) ** 2;
  return 2 * R * Math.asin(Math.sqrt(x));
}
function bearingBetween(lat1, lon1, lat2, lon2) {
  const φ1 = lat1 * Math.PI / 180, φ2 = lat2 * Math.PI / 180, Δλ = (lon2 - lon1) * Math.PI / 180;
  const y = Math.sin(Δλ) * Math.cos(φ2);
  const x = Math.cos(φ1) * Math.sin(φ2) - Math.sin(φ1) * Math.cos(φ2) * Math.cos(Δλ);
  return (Math.atan2(y, x) * 180 / Math.PI + 360) % 360;
}

  const R = 6371, br = brg * Math.PI / 180, lat1 = lat * Math.PI / 180, lon1 = lon * Math.PI / 180;

  const lon2 = lon1 + Math.atan2(Math.sin(br) * Math.sin(distKm / R) * Math.cos(lat1), Math.cos(distKm / R) - Math.sin(lat1) * Math.sin(lat2));
  return [lat2 * 180 / Math.PI, lon2 * 180 / Math.PI];

function compassName(deg) {

  const i = Math.round(((deg % 360) + 360) % 360 / 45) % 8;
  return dirs[i];
}

    if (!u) return null;
    return { km: haversineKm(u.lat, u.lon, lat, lon), bearing: bearingBetween(u.lat, u.lon, lat, lon) };

}

}

function levenshtein(a, b) {
  a = (a || "").toLowerCase(); b = (b || "").toLowerCase();
  const m = a.length, n = b.length;
  if (!m) return n; if (!n) return m;
  const dp = Array.from({ length: m + 1 }, () => new Array(n + 1).fill(0));
  for (let i = 0; i <= m; i++) dp[i][0] = i;
  for (let j = 0; j <= n; j++) dp[0][j] = j;
  for (let i = 1; i <= m; i++) for (let j = 1; j <= n; j++) {
    const c = a[i - 1] === b[j - 1] ? 0 : 1;
    dp[i][j] = Math.min(dp[i - 1][j] + 1, dp[i][j - 1] + 1, dp[i - 1][j - 1] + c);
  }
  return dp[m][n];
}

    const removeBtn = `<button type="button" class="popup-remove-btn" data-remove-kind="msg" data-remove-key="${esc(tx._key || "")}">🗑 Видалити маркер</button>`;
    return `<div class="popup-title type-${tx.type}">${esc(label)} ${seedTag}</div><div>${esc((tx.sampleText || tx.text || "").slice(0, 200))}</div>${etaLine}${userRel}<div class="popup-meta" style="margin-top:5px">${placeLine}${t("updated") || ""}${new Date().toLocaleString("uk-UA")}</div>${chList ? `<div class="popup-channels"><b>Джерела:</b><br>${chList}</div>` : ""}${removeBtn}`;
  }
  function buildImpact(r) {
    const tt = new Date(r.lastSeen).toLocaleTimeString("uk-UA", { hour: "2-digit", minute: "2-digit" });

  }

/* ==== FEED ==== */
const Feed = (() => {
  let timer = null;
  function schedule() { if (timer) return; timer = setTimeout(() => { timer = null; render(); }, 300); }
  function iconFor(item) {
    const ty = item.cls?.type || "";
    if (item.kind === "impact" || ty === "impact") return "💥";
    if (ty === "zircon" || ty === "ballistic") return "🚨";
    if (ty === "jet_drone") return "⚡";
    if (["geran2","geran3","geran4","geran5"].includes(ty)) return "🛸";
    if (["missile","kab","banderol"].includes(ty)) return "🚀";
    if (ty === "recon") return "👁";
    if (["uav","fpv"].includes(ty)) return "🛸";
    return "📍";
  }
  function colorFor(item) {
    const ty = item.cls?.type || "";
    if (item.kind === "impact" || ty === "impact") return "#ff7c3b";
    if (ty === "zircon" || ty === "ballistic") return "#d94a8c";
    if (["jet_drone","geran2","geran3","geran4","geran5"].includes(ty)) return "#dc2626";
    if (["missile","kab","banderol"].includes(ty)) return "#e55757";
    if (ty === "recon") return "#3b82f6";
    if (["uav","fpv"].includes(ty)) return "#facc15";
    return "#4ca9e8";
  }
  function collect() {
    const out = [];
    for (const o of State.msgMarkers.values()) {
      if (!o.marker) continue;
      const ll = o.marker.getLatLng(); if (!ll) continue;
      out.push({
        kind: o.isSeed ? "seed" : "msg", id: o._key, cls: { type: o.cls.type, label: o.exactName || o.cls.label },
        name: o.place?.name || "—", lat: ll.lat, lng: ll.lng, eta: o.eta,
        dist: haversineKm(CONFIG.KYIV[0], CONFIG.KYIV[1], ll.lat, ll.lng),
        ts: o.lastSeen || Date.now(), marker: o.marker, isSeed: o.isSeed,
        hasPriority: !!o.hasPriority, channels: o.channels, speed: o.speedKmh || null
      });
    }
    out.sort((a, b) => b.ts - a.ts);
    return out;
  }
  function render() {
    const cont = $("events"), cnt = $("eventCount"); if (!cont) return;
    const items = collect();
    if (cnt) cnt.textContent = items.length + " подій";
    if (!items.length) { cont.innerHTML = `<div class="panel-empty">Немає активних подій</div>`; return; }
    cont.innerHTML = items.slice(0, 60).map((it, idx) => {
      const color = colorFor(it);
      const icon = iconFor(it);
      const time = new Date(it.ts).toLocaleTimeString("uk-UA", { hour: "2-digit", minute: "2-digit" });
      let tags = "";
      if (it.isSeed) tags += `<span class="tag seed">📚 SEED</span>`;
      if (it.speed) tags += `<span class="tag speed">⚡ ${it.speed} км/год</span>`;
      if (it.eta != null) tags += `<span class="tag">⏱ ${formatEta(it.eta)}</span>`;
      return `<div class="event" data-feed-idx="${idx}" style="border-left-color:${color}"><div class="event-top"><div class="event-type" style="color:${color}"><span class="event-icon">${icon}</span>${esc(it.cls.label)}</div><div class="event-time">${time}</div></div><div class="event-loc">📍 ${esc(it.name)}</div>${tags ? `<div class="event-meta">${tags}</div>` : ''}</div>`;
    }).join("");
    cont.querySelectorAll(".event").forEach(el => {
      el.addEventListener("click", () => {
        const idx = +el.getAttribute("data-feed-idx");
        const it = items[idx]; if (!it) return;
        if (it.lat != null) map.setView([it.lat, it.lng], 12, { animate: true });
      });
    });
  }
  return { schedule, render, collect, iconFor, colorFor };
})();

/* ==== MESSAGE PROCESSOR ==== */
function syncMessageThreats(messages) {
  const now = Date.now();
  const candidates = new Map();

  for (let i = 0; i < (messages || []).length; i++) {
    const m = messages[i];
    const text = m.text || "";
    const ch = (m.channel || "unknown").replace(/^@/, "").toLowerCase();
    const msgMs = m.date ? Date.parse(m.date) : (m.ts ? Date.parse(m.ts) : now);
    if (!text || text.length < 5) continue;

    try { BallisticTimer.check(text, msgMs); } catch (e) {}
    try { MissileStock.detect(text, ch, msgMs); } catch (e) {}

    /* === SEED DIRECT: место с координатами — ставим напрямую === */
    const seedPlaces = m.places || [];
    const seedCoords = m.place_coords || {};
    const isSeedDirect = m._seed === true || (seedPlaces.length && Object.keys(seedCoords).length);

    if (isSeedDirect && (seedPlaces.length || Object.keys(seedCoords).length)) {
      const clsBase = CLASSIFIER(text) || { type: m.type || "uav", label: getMeta(m.type || "uav").label, hard: true };
      if (m.type) clsBase.type = m.type;
      if (m.subtype) clsBase._exactName = m.subtype;
      if (!clsBase.label) clsBase.label = getMeta(clsBase.type).label;

      for (const placeName of seedPlaces) {
        const c = seedCoords[placeName];
        if (!c || !Number.isFinite(c.lat) || !Number.isFinite(c.lng)) continue;
        if (!inZone(c.lat, c.lng)) continue;
        const key = `seed|${placeName}|${clsBase.type}|${Math.round(msgMs/60000)}`;
        if (State.isDismissed(key)) continue;
        if (candidates.has(key)) continue;
        candidates.set(key, {
          kind: "seed_place", _key: key,
          place: { name: placeName, lat: c.lat, lon: c.lng },
          cls: clsBase, stage: m.stage || null,
          channels: new Set([ch]),
          firstSeen: msgMs, lastSeen: msgMs,
          sampleText: text, exactName: m.subtype || null,
          _seedDirect: true
        });
      }
      continue; // не обрабатываем дальше через regex
    }

    /* === REGEX PATH: обычные сообщения === */
    const cls = CLASSIFIER(text);
    if (!cls) continue;

    const place = findPlaceInText(text);
    if (place && inZone(place.lat, place.lon)) {
      const key = `msg|${place.key}|${cls.type}`;
      if (!candidates.has(key)) candidates.set(key, {
        kind: "place", _key: key, place, cls,
        stage: /пуск|запуск|зліт|виліт/i.test(text) ? "launch" : (/прил[іi]т|влуч|удар\s+по/i.test(text) ? "impact" : (/збит|перехоп/i.test(text) ? "shot" : (/впав|падінн|упал/i.test(text) ? "falling" : null))),
        channels: new Set([ch]), firstSeen: msgMs, lastSeen: msgMs,
        sampleText: text, exactName: m.exactName || null
      });
      else {
        const c = candidates.get(key); c.channels.add(ch);
        if (msgMs < c.firstSeen) c.firstSeen = msgMs;
        if (msgMs > c.lastSeen) c.lastSeen = msgMs;
      }
    }
  }

  /* === RENDER CANDIDATES === */
  for (const [key, c] of candidates) {
    if (State.isDismissed(key)) continue;
    const confirmN = c.channels.size;
    const totalW = totalWeightOf(c.channels);
    const hasPrio = hasPrioritySource(c.channels);

    // seed_direct всегда проходит (даже с 1 источником)
    if (!c._seedDirect) {
      if (confirmN < CONFIG.MIN_CHANNELS_CONFIRM && !hasPrio) continue;
    }

    const { place, cls, stage } = c;
    const speed = resolveSpeedKmh(cls.type, c.sampleText);
    const eta = etaToKyivMin(place.lat, place.lon, cls.type, speed);

    // Удалить старый маркер если есть
    if (State.msgMarkers.has(key)) {
      const old = State.msgMarkers.get(key);
      if (old.marker && msgThreatLayer) try { msgThreatLayer.removeLayer(old.marker); } catch (e) {}
    }

    const marker = L.marker([place.lat, place.lon], {
      icon: makeIcon(cls, null, confirmN, totalW, false, false, null, stage, false, hasPrio, false, speed),
      zIndexOffset: 900
    });

    const popupHtml = Popup.buildGeneric(
      { type: cls.type, _exactName: c.exactName, _key: key, sampleText: c.sampleText },
      eta, place, c.channels, c._seedDirect
    );
    marker.bindPopup(popupHtml, CONFIG.POPUP_OPTS);
    marker.addTo(msgThreatLayer);

    State.msgMarkers.set(key, {
      _key: key, marker, cls, place, eta, speedKmh: speed,
      hasPriority: hasPrio, channels: c.channels,
      exactName: c.exactName || null,
      lastSeen: c.lastSeen, firstSeen: c.firstSeen,
      isSeed: !!c._seedDirect, stage
    });

    Audio.maybeSirenForPlace(key, cls, place.lat, place.lon, [...c.channels][0]);
  }

  // Уборка старых
  const cutoff = now - CONFIG.STALE_MSG_MS * 3;
  for (const [key, o] of [...State.msgMarkers]) {
    if (o.isSeed) continue; // seed не удаляем
    if (now - o.lastSeen > CONFIG.STALE_MSG_MS) {
      if (o.marker && msgThreatLayer) try { msgThreatLayer.removeLayer(o.marker); } catch (e) {}
      State.msgMarkers.delete(key);
    }
  }
  Feed.schedule();
}

/* ==== REMOVE ==== */
function removeMarkerByKey(kind, key) {
  try {
    if (kind === "msg" || kind === "seed") {
      const o = State.msgMarkers.get(key);
      if (o && o.marker && msgThreatLayer) msgThreatLayer.removeLayer(o.marker);
      State.msgMarkers.delete(key); State.dismiss(key);
    } else if (kind === "impact") {
      const r = State.impactReports.get(key);
      if (r && r.marker && impactLayer) impactLayer.removeLayer(r.marker);
      State.impactReports.delete(key); State.dismiss(key);
    } else if (kind === "impactMarker") {
      const o = State.impactMarkers.get(key);
      if (o && o.marker && impactLayer) impactLayer.removeLayer(o.marker);
      State.impactMarkers.delete(key); State.dismiss(key);
    }
    Feed.schedule();
    showToast("🗑 Видалено");
  } catch (e) { RadarLog.push("removeMarkerByKey", e.message, e); }
}

/* ==== SEED LOADER ==== */
const SeedLoader = (() => {
  const SEEN_KEY = "kyiv_seed_seen_v3";
  let seen = new Set();
  try { const raw = localStorage.getItem(SEEN_KEY); seen = new Set(raw ? JSON.parse(raw) : []); } catch (e) { seen = new Set(); }
  function saveSeen() { try { localStorage.setItem(SEEN_KEY, JSON.stringify([...seen].slice(-1000))); } catch (e) {} }
  function hashKey(m) { return (m.text || "").slice(0, 100).toLowerCase().replace(/\s+/g, " ") + "|" + ((m.ts || "").slice(0, 16)); }
  function run() {
    const arr = window.SEED_MESSAGES;
    if (!Array.isArray(arr) || !arr.length) { console.info("[seed] нет данных"); return; }
    console.info(`[seed] загружаю ${arr.length} записей…`);
    const fresh = [];
    for (const m of arr) {
      const k = hashKey(m);
      if (seen.has(k)) continue;
      seen.add(k);
      fresh.push(m);
    }
    saveSeen();
    if (!fresh.length) { console.info("[seed] все уже загружены"); return; }

    try {
      syncMessageThreats(fresh.map(r => ({
        text: r.text,
        channel: "seed",
        ts: r.ts || new Date().toISOString(),
        date: r.ts || new Date().toISOString(),
        type: r.type, subtype: r.subtype,
        places: r.places, place_coords: r.place_coords,
        stage: r.stage,
        _seed: true
      })));
      console.info(`[seed] загружено ${fresh.length} новых`);
      showToast(`📚 Завантажено ${fresh.length} seed-записів`, 2500);
    } catch (e) { RadarLog.push("seed", e.message, e); }
  }
  function reset() { seen = new Set(); saveSeen(); localStorage.removeItem(SEEN_KEY); }
  return { run, reset };
})();

/* ==== GEOLOC ==== */
const GeoLoc = (() => {
  let watchId = null, marker = null, accuracyCircle = null, lastPos = null, enabled = false, headingDeg = null, lastCoords = null, orientationHandler = null;
  function makeIcon() {
    const arrow = headingDeg != null ? `<div class="user-loc-arrow" style="transform:translateX(-50%) rotate(${headingDeg}deg)"></div>` : "";
    return L.divIcon({ className: "", html: `<div class="user-loc-marker">${arrow}<div class="user-loc-dot"></div></div>`, iconSize: [22,22], iconAnchor: [11,11] });
  }
  function onPosition(pos) {
    lastPos = pos;
    const lat = pos.coords.latitude, lon = pos.coords.longitude;
    lastCoords = { lat, lon };
    const acc = pos.coords.accuracy || 0;
    if (pos.coords.heading != null && !isNaN(pos.coords.heading) && pos.coords.speed > 0.5) headingDeg = pos.coords.heading;
    if (!marker) {
      marker = L.marker([lat, lon], { icon: makeIcon(), zIndexOffset: 3000 });
      marker.bindPopup(`<div class="popup-title">🧭 Моє місцезнаходження</div><div class="popup-meta">${lat.toFixed(5)}, ${lon.toFixed(5)}<br>±${Math.round(acc)} м</div>`);
      marker.addTo(map);
    } else {
      marker.setLatLng([lat, lon]); marker.setIcon(makeIcon());
    }
    if (!accuracyCircle) {
      accuracyCircle = L.circle([lat, lon], { radius: acc, className: "user-loc-accuracy", interactive: false });
      accuracyCircle.addTo(map);
    } else { accuracyCircle.setLatLng([lat, lon]); accuracyCircle.setRadius(acc); }
    _userPos = { lat, lon };
    try { refreshNearUserIcons(); } catch (e) {}
  }
  function onError(err) { showToast("🧭 Помилка геолокації", 3000); }
  function startOrientation() {
    if (orientationHandler) return;
    const handler = (e) => {
      let h = null;
      if (e.webkitCompassHeading != null) h = e.webkitCompassHeading;
      else if (e.alpha != null) h = 360 - e.alpha;
      if (h != null && !isNaN(h)) { headingDeg = h; if (marker) marker.setIcon(makeIcon()); }
    };
    orientationHandler = handler;
    window.addEventListener("deviceorientationabsolute", handler, true);
    window.addEventListener("deviceorientation", handler, true);
  }
  function start() {
    if (!("geolocation" in navigator)) { showToast("🧭 Геолокація недоступна"); return; }
    if (watchId != null) return;
    watchId = navigator.geolocation.watchPosition(onPosition, onError, { enableHighAccuracy: true, maximumAge: 1000, timeout: 20000 });
    enabled = true; $("btnGeo").classList.add("on"); showToast("🧭 Геолокація увімкнена");
    if (window.DeviceOrientationEvent && typeof DeviceOrientationEvent.requestPermission === "function") {
      DeviceOrientationEvent.requestPermission().then(p => { if (p === "granted") startOrientation(); }).catch(() => {});
    } else startOrientation();
  }
  function stop() {
    if (watchId != null) { navigator.geolocation.clearWatch(watchId); watchId = null; }
    enabled = false; $("btnGeo").classList.remove("on");
    if (marker) { map.removeLayer(marker); marker = null; }
    if (accuracyCircle) { map.removeLayer(accuracyCircle); accuracyCircle = null; }
    _userPos = null; refreshNearUserIcons();
  }
  function toggle() { enabled ? stop() : start(); }
  function center() { if (!lastPos) { showToast("🧭 Позиція не визначена"); return; } map.setView([lastPos.coords.latitude, lastPos.coords.longitude], Math.max(map.getZoom(), 15), { animate: true }); }
  return { start, stop, toggle, center, isEnabled: () => enabled, getLast: () => lastCoords };
})();

  lines.push(`📊 РАКЕТНИЙ АРСЕНАЛ (01.10.2026 → ${MissileStock.monthsSince()} міс.)`);
  for (const s of MissileStock.getStats()) {
    const tot = s.produced > 0 ? `${s.initial}+${s.produced}` : `${s.initial}`;
    lines.push(`🔳 ${s.label}: ${tot} − ${s.used} = ${s.remaining}`);
  }
  lines.push("");
  lines.push(`🎯 Масштаб: ${Scope.isUkraine() ? "Вся Україна" : "Київ + 250 км"}`);
  body.textContent = lines.join("\n");
  $("aiModalTime").textContent = new Date().toLocaleTimeString("uk-UA");
  $("aiModalBackdrop").classList.add("show");
}

/* ==== INIT ==== */
async function init() {
  try {
    $("statusText").textContent = "ЗАГРУЗКА…";
    initMap();
    initUI();
    applyScopeMode(false);
    Feed.render();
    setTimeout(() => {
      try { SeedLoader.run(); } catch (e) { RadarLog.push("seed.init", e.message, e); }
    }, 1500);
    setTimeout(() => Audio.unlock(), 500);
    window.SeedLoader = SeedLoader;
    window.MissileStock = MissileStock;
  } catch (e) { RadarLog.push("init", e.message, e); RadarLog.showBanner("init: " + (e && e.message || e)); }
}
if (document.readyState === "loading") document.addEventListener("DOMContentLoaded", init);
else init();
</script>
</body>
</html>
